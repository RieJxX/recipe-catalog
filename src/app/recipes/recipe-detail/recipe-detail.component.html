<div *ngIf="recipe" class="recipe-detail">
    <h2>{{ recipe.title }}</h2>
    <p><strong>Создан:</strong> {{ recipe.createdAt.toDate() | date:'short' }}</p>
    <img *ngIf="recipe.imageUrl" [src]="recipe.imageUrl" alt="Изображение рецепта" class="recipe-image">
    <h3>Ингредиенты:</h3>
    <ul>
      <li *ngFor="let ing of recipe.ingredients">
        {{ ing.name }} – {{ ing.quantity }} {{ ing.unit }}
      </li>
    </ul>
    <h3>Описание приготовления:</h3>
    <p>{{ recipe.description }}</p>
    <button mat-raised-button color="primary" (click)="goBack()">Назад</button>
  </div>
